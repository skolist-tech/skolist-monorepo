name: "E2E Tests"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1. Setup Environment
      # ----------------------------------------------------------------
      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          cd ../e2e 
          npm install

      # ----------------------------------------------------------------
      # 2. Start Services
      # ----------------------------------------------------------------

      # Supabase
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          cd skolist-db 
          supabase start
          # Export envs for subsequent steps
          echo "SUPABASE_URL=$(supabase status -o json | jq -r .api_url)" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .anon_key)" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=$(supabase status -o json | jq -r .service_role_key)" >> $GITHUB_ENV

      # Backend (Docker)
      - name: Start Backend (Docker)
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: "mock_key"
          GEMINI_API_KEY: "mock_key"
          DEPLOYMENT_ENV: "LOCAL"
        run: |
          cd backend

          # Build
          docker build -t backend:latest .

          # Run container
          # Cleanup previous run if exists
          docker rm -f backend || true

          docker run -d \
            -p 8000:8080 \
            -e SUPABASE_URL="$SUPABASE_URL" \
            -e SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY" \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e GEMINI_API_KEY="$GEMINI_API_KEY" \
            -e DEPLOYMENT_ENV="$DEPLOYMENT_ENV" \
            --name "backend-${{ github.run_id }}" \
            backend:latest

          # Wait for healthcheck
          timeout 60 bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 1; done' || (echo "Backend failed to start. Logs:" && docker logs "backend-${{ github.run_id }}" && exit 1)

      # Frontend (AI Paper Generator)
      # Frontend + Tests (Combined to ensure process stays alive)
      - name: Start Frontend and Run Tests
        env:
          # Frontend Envs
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          VITE_FASTAPI_URL: "http://localhost:8000"
          # Playwright Envs
          BASE_URL: "http://localhost:3001"
          API_URL: "http://localhost:8000"
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
        run: |
          # 1. Start Frontend
          cd frontend/apps/ai_paper_generator
          echo "Starting Frontend..."
          # Use preview if build was run, but here we use dev for speed/consistency with previous setup
          nohup pnpm dev --port 3001 > frontend.log 2>&1 &
          FRONTEND_PID=$!

          # Wait for healthcheck
          echo "Waiting for Frontend to be ready..."
          if ! timeout 60 bash -c 'until curl -s http://localhost:3001/ > /dev/null; do sleep 2; done'; then
            echo "Frontend failed to start. Logs:"
            cat frontend.log
            exit 1
          fi
          echo "Frontend is ready!"

          # 2. Run Tests
          cd ../../../e2e
          # Install dependencies if not already (should be cached/installed in previous step)
          npx playwright install --with-deps chromium

          echo "Running Playwright Tests..."
          npx playwright test
          TEST_EXIT_CODE=$?

          # 3. Cleanup
          kill $FRONTEND_PID || true

          # Exit with test result
          exit $TEST_EXIT_CODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Cleanup Backend Container
        if: always()
        run: docker rm -f "backend-${{ github.run_id }}" || true
