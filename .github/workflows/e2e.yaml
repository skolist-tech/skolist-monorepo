name: "E2E Tests"

on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 1. Setup Environment
      # ----------------------------------------------------------------
      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          cd ../e2e 
          npm install

      # ----------------------------------------------------------------
      # 2. Start Services
      # ----------------------------------------------------------------

      # Supabase
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          cd skolist-db 
          supabase start
          # Export envs for subsequent steps
          echo "SUPABASE_URL=$(supabase status -o json | jq -r .api_url)" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .anon_key)" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_KEY=$(supabase status -o json | jq -r .service_role_key)" >> $GITHUB_ENV

      # Backend (Docker)
      - name: Start Backend (Docker)
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: "mock_key"
          GEMINI_API_KEY: "mock_key"
          DEPLOYMENT_ENV: "LOCAL"
        run: |
          cd backend

          # Build
          docker build -t backend:latest .

          docker run -d \
            --network="host" \
            -e SUPABASE_URL="$SUPABASE_URL" \
            -e SUPABASE_SERVICE_KEY="$SUPABASE_SERVICE_KEY" \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e GEMINI_API_KEY="$GEMINI_API_KEY" \
            -e DEPLOYMENT_ENV="$DEPLOYMENT_ENV" \
            --name "backend-${{ github.run_id }}" \
            backend:latest

          # Wait for healthcheck
          timeout 60 bash -c 'until curl -s http://localhost:8080/ > /dev/null; do sleep 1; done' || (echo "Backend failed to start. Logs:" && docker logs "backend-${{ github.run_id }}" && exit 1)

      # E2E Tests (Playwright handles frontend via webServer config)
      - name: Run E2E Tests
        env:
          # Frontend build env vars (used by Playwright webServer)
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          VITE_FASTAPI_URL: "http://localhost:8080"
          # Test env vars
          API_URL: "http://localhost:8080"
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY }}
        run: |
          cd e2e
          npx playwright install --with-deps chromium
          echo "Running Playwright Tests..."
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Cleanup Backend Container
        if: always()
        run: docker rm -f "backend-${{ github.run_id }}" || true
