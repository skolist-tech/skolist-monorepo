name: "Cloud Run Deploy (Stage) (Backend)"

on:
  push:
    branches:
      - stage
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  SERVICE_NAME: "backend-stage"
  REGION: "asia-south1"
  IMAGE: "asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-app/backend"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push Image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:stage-${{ github.sha }} \
            -t ${{ env.IMAGE }}:stage-latest \
            ./backend
          docker push ${{ env.IMAGE }}:stage-${{ github.sha }}
          docker push ${{ env.IMAGE }}:stage-latest

      - name: Deploy new image to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}:stage-${{ github.sha }}