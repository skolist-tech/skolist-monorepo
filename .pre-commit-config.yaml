repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged
        entry: bash -c 'cd frontend && ./node_modules/.bin/lint-staged'
        language: system
        pass_filenames: false
        files: ^frontend/
