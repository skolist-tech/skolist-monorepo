[project]
name = "paper-extract"
version = "0.1.0"
description = "Extract an MHT-CET question paper from a scanned PDF into a test JSON object."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "litellm>=1.63.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
paper-extract = "paper_extract.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_extract"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
