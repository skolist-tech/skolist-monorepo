[project]
name = "extraction-app"
version = "0.1.0"
description = "Extract a scanned question paper PDF into paper.json. One LangGraph per paper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "litellm>=1.63.0",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
