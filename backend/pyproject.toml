[project]
name = "skolist-backend"
version = "0.1.0"
description = "FastAPI service for Skolist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.123.10",
    "firebase-admin==6.6.0",
    "google-genai==1.56.0",
    "instructor[litellm]>=1.17.0",
    "litellm>=1.83.0",
    "math2docx==2.0.3",
    "openai==2.14.0",
    "playwright==1.63.0",
    "python-dotenv==1.2.1",
    "python-json-logger==4.0.0",
    "python-multipart>=0.0.32",
    "standardwebhooks>=1.1.0",
    "supabase==2.27.0",
    "uvicorn==0.40.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pre-commit>=3.6.0",
    "pylint==4.0.4",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.3.0",
    "supabase-pydantic==0.26.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    # Ignore deprecation warnings from third-party packages
    "ignore::DeprecationWarning:pyiceberg.*",
    "ignore::DeprecationWarning:supabase.*",
    "ignore::pydantic.PydanticDeprecatedSince212:pyiceberg.*",
    "ignore::DeprecationWarning:pythonjsonlogger.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:google.genai.*",
]
markers = [
    "slow: marks tests as slow (use -m 'not slow' to skip)",
    "unit: marks as unit test (no external dependencies)",
    "integration: marks as integration test (requires Supabase)",
    "live_gemini: marks tests that require --gemini-live flag",
    "auth: marks authentication-related tests",
    "qgen: marks question generation tests",
    "bank: marks bank management tests",
    "assessment: marks assessment API tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "venv", "schema_public_latest.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E402",   # module-level import not at top (often intentional after env setup)
    "B008",   # function call in default argument (standard FastAPI pattern for Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
